epoch = "3.3"

[contracts.privara-registry]
path = "contracts/privara-registry.clar"
clarity_version = 4
epoch = "3.3"

[contracts.privara-pool]
path = "contracts/privara-pool.clar"
clarity_version = 4
epoch = "3.3"

[repl.analysis]
